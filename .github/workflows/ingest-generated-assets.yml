name: Ingest Generated PNG Assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-upload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore generated PNG assets
        shell: bash
        run: |
          set -euo pipefail
          test -d .asset-upload
          cat .asset-upload/chunk-* | base64 --decode > /tmp/bead-assets.zip
          unzip -o /tmp/bead-assets.zip -d .

          mkdir -p src/assets promotion/logo public
          cp public/brand-logo.png src/assets/brand-logo.png
          cp public/app-icon.png src/assets/brand-icon.png
          cp public/brand-logo.png promotion/logo/brand-logo.png
          cp public/app-icon.png promotion/logo/brand-icon.png
          cp public/app-icon.png public/favicon.png

          test -f promotion/01-xiaohongshu-cover.png
          test -f promotion/02-overview.png
          test -f promotion/03-inventory-optimizer.png
          test -f promotion/04-photo-inspection.png
          test -f promotion/05-full-workflow.png
          test -f public/brand-logo.png
          test -f public/app-icon.png
          test -f public/favicon.png

      - name: Switch product branding to generated PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/brand.css')
          s = p.read_text()
          s = s.replace("./assets/brand-logo.svg", "./assets/brand-logo.png")
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('type="image/svg+xml" href="./favicon.svg"', 'type="image/png" href="./favicon.png"')
          s = s.replace('href="./app-icon.svg"', 'href="./app-icon.png"')
          p.write_text(s)

          p = Path('public/manifest.webmanifest')
          data = json.loads(p.read_text())
          data['icons'] = [
              {'src': './app-icon.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any maskable'}
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('public/sw.js')
          s = p.read_text().replace("bead-studio-v0.7-brand", "bead-studio-v0.7-png-brand")
          p.write_text(s)
          PY

          rm -f public/app-icon.svg public/favicon.svg public/brand-logo.svg
          rm -f src/assets/brand-icon.svg src/assets/brand-logo.svg
          rm -f promotion/logo/brand-icon.svg promotion/logo/brand-logo.svg
          rm -rf .asset-upload

      - name: Commit generated PNG assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "assets: add generated PNG branding and promotion posters"
          git push origin HEAD:main
