name: Package Bead Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run core tests
        run: npm run test:core

      - name: Build
        run: npm run build

      - name: Create zip package
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ZIP_NAME="bead-studio-${SHORT_SHA}.zip"
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -lh "${ZIP_NAME}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: bead-studio-${{ github.sha }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
