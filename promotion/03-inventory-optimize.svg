<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.t{fill:#2b2622}.m{fill:#7e7166}.g{fill:#4a6854}.b{font-weight:700}</style></defs><rect width="1080" height="1350" fill="#f5efe7"/><text x="70" y="92" class="g b" font-size="22">SMART INVENTORY</text><text x="70" y="164" class="t b" font-size="58">豆不够，先别急着买</text><text x="70" y="210" class="m" font-size="27">先看看手里的豆，能不能把这张图重新算出来。</text><rect x="70" y="290" width="940" height="775" rx="34" fill="#fffaf4" stroke="#dfd1c4" stroke-width="2"/><g transform="translate(110 350)"><g><circle cx="34" cy="34" r="24" fill="#37abe5"/><circle cx="34" cy="34" r="8" fill="#e8ded4"/><text x="78" y="26" class="t b" font-size="28">C4</text><text x="78" y="58" class="m" font-size="19">需要 300 · 库存 80</text><rect x="310" y="18" width="210" height="34" rx="17" fill="#eee8e1"/><rect x="310" y="18" width="56" height="34" rx="17" fill="#c56f79"/></g><g transform="translate(0 120)"><circle cx="34" cy="34" r="24" fill="#f75a48"/><circle cx="34" cy="34" r="8" fill="#e8ded4"/><text x="78" y="26" class="t b" font-size="28">A14</text><text x="78" y="58" class="m" font-size="19">需要 180 · 库存 220</text><rect x="310" y="18" width="210" height="34" rx="17" fill="#eee8e1"/><rect x="310" y="18" width="210" height="34" rx="17" fill="#4a6854"/></g><g transform="translate(0 240)"><circle cx="34" cy="34" r="24" fill="#2b9d4f"/><circle cx="34" cy="34" r="8" fill="#e8ded4"/><text x="78" y="26" class="t b" font-size="28">B8</text><text x="78" y="58" class="m" font-size="19">需要 120 · 库存 156</text><rect x="310" y="18" width="210" height="34" rx="17" fill="#eee8e1"/><rect x="310" y="18" width="210" height="34" rx="17" fill="#4a6854"/></g><g transform="translate(0 360)"><circle cx="34" cy="34" r="24" fill="#8450b2"/><circle cx="34" cy="34" r="8" fill="#e8ded4"/><text x="78" y="26" class="t b" font-size="28">D7</text><text x="78" y="58" class="m" font-size="19">需要 95 · 库存 32</text><rect x="310" y="18" width="210" height="34" rx="17" fill="#eee8e1"/><rect x="310" y="18" width="70" height="34" rx="17" fill="#c56f79"/></g></g><path d="M655 485h72" stroke="#4a6854" stroke-width="7" stroke-linecap="round"/><path d="M728 485l-24-16v32z" fill="#4a6854"/><rect x="735" y="355" width="220" height="430" rx="28" fill="#ebf2ed" stroke="#c3d5c8" stroke-width="2"/><text x="845" y="405" class="g b" font-size="35" text-anchor="middle">0 元改图</text><text x="845" y="443" class="m" font-size="19" text-anchor="middle">优先使用现有库存</text><g fill="#fffaf4"><rect x="770" y="500" width="150" height="58" rx="16"/><rect x="770" y="585" width="150" height="58" rx="16"/><rect x="770" y="670" width="150" height="58" rx="16"/></g><g class="t b" font-size="20"><text x="790" y="537">C4 → C10</text><text x="790" y="622">C4 → C17</text><text x="790" y="707">D7 → D2</text></g><g class="g b" font-size="18" text-anchor="end"><text x="900" y="537">154</text><text x="900" y="622">66</text><text x="900" y="707">41</text></g><rect x="110" y="875" width="845" height="140" rx="24" fill="#f9f3ec" stroke="#dfd1c4"/><text x="145" y="920" class="t b" font-size="30">不是“缺多少买多少”</text><text x="145" y="965" class="m" font-size="22">而是在色差和库存之间，重新找一个真的能拼出来的方案。</text><text x="70" y="1290" class="m b" font-size="22">拼豆工作台 · Bead Studio</text><text x="1010" y="1290" class="m b" font-size="20" text-anchor="end">3/5</text></svg>