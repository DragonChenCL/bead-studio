<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.t{fill:#2b2622}.m{fill:#7e7166}.g{fill:#4a6854}.b{font-weight:700}</style><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><rect width="38" height="38" fill="#e8ddd2"/><circle cx="19" cy="19" r="12" fill="#f0c45e"/><circle cx="19" cy="19" r="5" fill="#e9dfd5"/></pattern></defs><rect width="1080" height="1350" fill="#f5efe7"/><text x="70" y="92" class="g b" font-size="22">BUILD · CHECK</text><text x="70" y="164" class="t b" font-size="58">拼了 3000 颗，不想重新数一遍</text><text x="70" y="210" class="m" font-size="27">施工进度 + 拍照验豆，把“我是不是放错了”变成可检查。</text><rect x="70" y="290" width="940" height="770" rx="34" fill="#fffaf4" stroke="#dfd1c4" stroke-width="2"/><rect x="105" y="340" width="545" height="590" rx="24" fill="url(#grid)"/><g opacity=".95"><rect x="176" y="451" width="38" height="38" fill="none" stroke="#c56f79" stroke-width="5"/><rect x="404" y="527" width="38" height="38" fill="none" stroke="#d1a55b" stroke-width="5"/><rect x="518" y="679" width="38" height="38" fill="none" stroke="#8f62a9" stroke-width="5"/><rect x="252" y="717" width="38" height="38" fill="none" stroke="#c56f79" stroke-width="5"/></g><rect x="690" y="340" width="260" height="165" rx="22" fill="#ebf2ed"/><text x="720" y="378" class="m" font-size="20">施工进度</text><text x="720" y="440" class="g b" font-size="56">76%</text><rect x="720" y="470" width="200" height="16" rx="8" fill="#d8e3db"/><rect x="720" y="470" width="152" height="16" rx="8" fill="#4a6854"/><g><rect x="690" y="555" width="260" height="88" rx="18" fill="#faf6f1" stroke="#dfd1c4"/><rect x="712" y="575" width="32" height="32" rx="8" fill="#c56f79"/><text x="762" y="582" class="t b" font-size="24">明显错色</text><text x="762" y="615" class="m" font-size="17">红框优先检查</text><rect x="690" y="665" width="260" height="88" rx="18" fill="#faf6f1" stroke="#dfd1c4"/><rect x="712" y="685" width="32" height="32" rx="8" fill="#d1a55b"/><text x="762" y="692" class="t b" font-size="24">需要确认</text><text x="762" y="725" class="m" font-size="17">黄框人工复核</text><rect x="690" y="775" width="260" height="88" rx="18" fill="#faf6f1" stroke="#dfd1c4"/><rect x="712" y="795" width="32" height="32" rx="8" fill="#8f62a9"/><text x="762" y="802" class="t b" font-size="24">疑似漏豆</text><text x="762" y="835" class="m" font-size="17">紫框补看空位</text></g><rect x="105" y="965" width="845" height="54" rx="18" fill="#efe9e3"/><text x="527" y="1000" fill="#3b4c42" class="b" font-size="22" text-anchor="middle">拼一段 → 拍一张 → 对一下 → 接着拼</text><text x="70" y="1290" class="m b" font-size="22">拼豆工作台 · Bead Studio</text><text x="1010" y="1290" class="m b" font-size="20" text-anchor="end">4/5</text></svg>